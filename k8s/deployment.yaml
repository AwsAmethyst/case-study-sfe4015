apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-study-app
  labels:
    app: case-study-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: case-study-app
  template:
    metadata:
      labels:
        app: case-study-app
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
